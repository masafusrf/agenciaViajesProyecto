<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajalo</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contacto.css">
</head>
<body>
    <header>
        <nav>
            <img src="imagenes/logo.png" alt="Imagen del logo. Mezcla la forma de un pájaro con un marcador de ubicación.">
            <ul>       
                <li><a href= "inicio.html">Inicio</a></li>
                <li><a href= "viajes.html">Viajes</a></li>
                <li><a href= "contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

<!-- section con el from de contacto -->
    <section id="contacto">

        <form>

            <h2>Contacta con nosotros</h2>

            <label for="nombre" id="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required><br>

            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" required><br>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" required><br>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+34 600 000 000" pattern="[+]{0,1}[0-9\s]{6,20}"><br>

            <label>Tipo de viaje</label>

            <!-- selector tipo radio -->
            <div class="radio-group">
                <label>
                    <input type="radio" name="tipoViaje" value="negocios">
                    Negocios
                </label>

                <label>
                    <input type="radio" name="tipoViaje" value="placer">
                    Placer
                </label>
            </div>

            <!-- select opciones -->
            <label for="cliente">Tipo de viajero</label>
            <select id="clientes" name="clientes">
                <option value="empresa">Empresa</option>
                <option value="colegio">Colegio</option>
                <option value="particular" selected>Particular</option>
            </select>


            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe aquí tu mensaje." required></textarea><br>

            <input id="botonEnviar" type="submit" value="Enviar">

        </form>

    </section>

    <footer>
        <img id="logo_footer" src="imagenes/logo_footer.png" alt="Imagen del logo con el nombre de la marca debajo." srcset="">

        <section id="redes">

            <h4>Síguenos en nuestras redes sociales</h4>
            <a href="https://www.instagram.com/">
                <img src="imagenes/ig.png" alt="Logo de Instagram." srcset="">
            </a>

            <a href="https://es-es.facebook.com/">
                <img src="imagenes/facebook.png" alt="Logo de Facebook." srcset="">
            </a>

        </section>

        <section id="ubicacion">

            <div id="direccion" name="direccion">
                <img id="logo_ubi" src="imagenes/ubi.png" alt="Logo ubicación." srcset="">
                <p>C/ del Rei en Jaume I, 2, 46470, Catarroja. </p>
            </div>

            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3082.9541886252714!2d-0.4153018241842784!3d39.40254247162048!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd604e82a8672a35%3A0xed578f5f80fed685!2sFlorida%20University!5e0!3m2!1sen!2ses!4v1760871761150!5m2!1sen!2ses" 
                width="600" 
                height="450" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>

        </section>

        <section id="copyright">
            <p>
                © Creado por Mabel San Román.
            </p>
        </section>

    </footer>
</body>
</html>
